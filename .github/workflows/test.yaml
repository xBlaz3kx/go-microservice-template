name: "Test services"
on:
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.run/**'
      - '.vscode/**'
      - 'api/**'
      - 'features/**'
      - 'config/**'
      - 'deployments/**'
      - 'scripts/**'
      - 'assets/**'
      - '*.md'
  workflow_dispatch:

jobs:
  unit:
    name: "Run unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.22.1

        # todo skip mocks coverage
      - name: Install dependencies and run tests
        run: |
          go mod download
          make unit-tests

  integration:
    name: "Run integration tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.22.1

      - name: Install dependencies and run tests
        run: |
          make integration-tests